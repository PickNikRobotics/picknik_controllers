name: ROS Lint

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main

jobs:
  ament_lint:
    name: ament_${{ matrix.linter }}
    runs-on: ubuntu-latest
    # Pinned to lyrical: it is the newest distro whose build job in
    # build_and_test.yaml is BLOCKING, so the linters match the toolchain that
    # actually gates merges. rolling is newer but non-blocking, and linting
    # against a distro we do not gate on would put lint failures on a job nobody
    # is obliged to fix.
    #
    # Runs in a container rather than on the runner because lyrical is Ubuntu
    # Resolute and GitHub has no 26.04 runner yet. ros-tooling/setup-ros on a
    # noble runner cannot install lyrical -- that exact mismatch is what broke
    # the old coverage job, and this avoids repeating it.
    container: ros:lyrical-ros-base
    strategy:
      fail-fast: false
      matrix:
        include:
          - linter: copyright
            apt: ament-copyright
            args: ""
          - linter: lint_cmake
            apt: ament-lint-cmake
            args: ""
          - linter: cpplint
            apt: ament-cpplint
            args: "--linelength=100 --filter=-whitespace/newline"
    steps:
      - uses: actions/checkout@v4
      - name: install ament_${{ matrix.linter }}
        run: |
          apt-get update -qq
          apt-get install -y -qq ros-lyrical-${{ matrix.apt }}
      # Lints the repository root rather than a package list. The previous config
      # named `picknik_controllers`, which is not a package in this repo, and
      # never linted picknik_twist_controller at all.
      - name: ament_${{ matrix.linter }}
        shell: bash
        run: |
          source /opt/ros/lyrical/setup.bash
          ament_${{ matrix.linter }} ${{ matrix.args }} .
